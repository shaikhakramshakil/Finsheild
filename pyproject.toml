[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsheild"
version = "0.1.0"
description = "Finsheild — ML-first fraud intelligence platform (Phase 1: Dataset pipeline)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "kagglehub>=0.3",
    "opendatasets>=0.1.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/finsheild"]
